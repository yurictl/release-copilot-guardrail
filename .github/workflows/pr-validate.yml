# Replaces the `deploy` workflow from Evidence E on the pull-request side.
#
# This job NEVER touches the cluster. It has no cloud credentials, no OIDC permission
# to assume a deploy role, and read-only repo scope. Its outputs are a rendered
# manifest, a verdict, a machine-readable change summary and a PR comment. Applying
# is a different workflow with a different trust boundary (production-apply.yml).
name: pr-validate

on:
  # Every pull request, deliberately un-filtered by path. A required status check that
  # is path-filtered never reports on the PRs it skips, so those PRs sit permanently
  # "expected — waiting for status" and the usual fix is to make the check optional.
  # Running an unconditional 30-second job is cheaper than that failure mode.
  pull_request:

# Least privilege: enough to comment, nothing that can reach a cluster.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: guardrail self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r solution/scripts/requirements.txt
      - name: Ensure a renderer is available
        run: |
          command -v kustomize >/dev/null && exit 0
          command -v kubectl   >/dev/null && exit 0
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin
      - name: ./validate.sh
        run: ./validate.sh

  guardrail:
    name: render + guardrail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the baseline render needs the base branch
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r solution/scripts/requirements.txt

      - name: Ensure a renderer is available
        run: |
          command -v kustomize >/dev/null && exit 0
          command -v kubectl   >/dev/null && exit 0
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin

      - name: Render the production overlay (this PR)
        run: ./scripts/render.sh > /tmp/rendered.yaml

      - name: Render the baseline (the deployed state)
        # `main` is the deployed state by construction: production-apply.yml only ever
        # applies from main. Rendering it — rather than reading a committed snapshot —
        # is what makes the diff-aware checks compare against reality.
        run: |
          git fetch --no-tags origin "$GITHUB_BASE_REF" || true
          git worktree add --detach /tmp/base "origin/$GITHUB_BASE_REF"
          ./scripts/render.sh /tmp/base > /tmp/baseline.yaml

      - name: Guardrail — manifests
        # Exit codes: 0 clean, 1 blocking findings, 2 could not evaluate (fail closed).
        # Recorded and enforced at the end so the PR comment is posted either way —
        # a guardrail that fails silently teaches people to ignore it.
        run: |
          set +e
          python3 solution/scripts/validate_manifest.py \
            --manifest /tmp/rendered.yaml \
            --baseline /tmp/baseline.yaml \
            --policy solution/policy/guardrail.yaml \
            --exceptions solution/exceptions \
            --out /tmp/change-summary.json > /tmp/guardrail.txt 2>&1
          echo "manifest_rc=$?" >> "$GITHUB_ENV"
          cat /tmp/guardrail.txt

      - name: Guardrail — CI workflows
        # Separate step so "someone re-added kubectl apply to a PR job" is its own red X,
        # not buried in a manifest report.
        if: always()
        run: |
          set +e
          python3 solution/scripts/validate_manifest.py \
            --workflows .github/workflows \
            --policy solution/policy/guardrail.yaml >> /tmp/guardrail.txt 2>&1
          echo "workflow_rc=$?" >> "$GITHUB_ENV"
          tail -n 40 /tmp/guardrail.txt

      - name: Plan against the live cluster (read-only)
        # Optional and explicitly read-only: a token bound to a role with get/list on
        # this namespace only. Absent here (no cluster in this exercise), and absent on
        # forks by design — a missing plan is a missing convenience, not a missing gate.
        if: vars.CLUSTER_CONFIGURED == 'true'
        continue-on-error: true
        run: kubectl diff -f /tmp/rendered.yaml || true

      - name: Note that no plan was produced
        if: vars.CLUSTER_CONFIGURED != 'true'
        run: echo "No read-only cluster credentials configured — skipping the plan. Every gate above still ran." | tee -a /tmp/guardrail.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: change-summary
          path: |
            /tmp/change-summary.json
            /tmp/guardrail.txt
            /tmp/rendered.yaml
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Guardrail report"
            echo '```'
            cat /tmp/guardrail.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the PR
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Guardrail report"
            echo
            echo '```'
            cat /tmp/guardrail.txt
            echo '```'
            echo
            echo "Machine-readable summary: the \`change-summary\` artifact on [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo "_A passing guardrail is a floor, not an approval. A human still owns this change._"
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md

      # Make this job a required status check in branch protection so a red guardrail
      # cannot be merged past.
      - name: Enforce
        if: always()
        run: |
          echo "manifest_rc=${manifest_rc:-2} workflow_rc=${workflow_rc:-2}"
          if [ "${manifest_rc:-2}" != "0" ] || [ "${workflow_rc:-2}" != "0" ]; then
            echo "::error::guardrail did not pass — see the PR comment. rc=2 means it could not evaluate (fail closed)."
            exit 1
          fi
