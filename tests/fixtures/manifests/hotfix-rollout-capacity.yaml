# An urgent hotfix that is compliant except for one thing: it widens
# maxUnavailable to replace pods faster, dropping worst-case availability to 2.
# This is the only fixture the sample exception record is allowed to cover.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gateway
  namespace: production
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 2
      maxSurge: 2
  selector:
    matchLabels:
      app: inference-gateway
  template:
    metadata:
      labels:
        app: inference-gateway
    spec:
      containers:
        - name: gateway
          image: registry.example.com/inference-gateway:2.5.1
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 5
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          env:
            - name: MODEL_PROVIDER
              value: "internal"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: inference-gateway-secrets
                  key: redis_url
