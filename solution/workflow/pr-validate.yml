# Replaces the `deploy` workflow from Evidence E on the pull-request side.
#
# This job NEVER touches the cluster. It has no cloud credentials, no OIDC
# permission to assume the deploy role, and read-only repo scope. Its outputs are
# a rendered manifest, a validation verdict, a machine-readable change summary and
# a PR comment. Applying is a different workflow with a different trust boundary
# (production-apply.yml).
name: pr-validate

on:
  pull_request:
    paths:
      - "k8s/**"
      - "solution/policy/**"
      - "solution/exceptions/**"
      - ".github/workflows/**"

# Least privilege: enough to comment, nothing that can reach a cluster.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: render + guardrail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out the deployed baseline
        # Diff-aware checks (secret-downgrade, capacity delta) need the state that
        # is actually running. `main` is the deployed state by construction because
        # production-apply.yml only ever applies from `main`.
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          git show "origin/${{ github.base_ref }}:k8s/production/deployment.yaml" > /tmp/baseline.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --require-hashes -r solution/scripts/requirements.txt || pip install pyyaml

      - name: Render production overlay
        run: |
          curl -sSLo /tmp/kustomize.tgz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf /tmp/kustomize.tgz -C /usr/local/bin
          kustomize build k8s/overlays/production > /tmp/rendered.yaml

      - name: Guardrail — manifests
        id: guardrail
        # Exit codes: 0 clean, 1 blocking findings, 2 could not evaluate (fail closed).
        # The verdict is recorded and enforced at the end so the PR comment is posted
        # either way — a guardrail that fails silently teaches people to ignore it.
        run: |
          set +e
          python3 solution/scripts/validate_manifest.py \
            --manifest /tmp/rendered.yaml \
            --baseline /tmp/baseline.yaml \
            --policy solution/policy/guardrail.yaml \
            --exceptions solution/exceptions \
            --out /tmp/change-summary.json > /tmp/guardrail.txt 2>&1
          echo "manifest_rc=$?" >> "$GITHUB_ENV"
          cat /tmp/guardrail.txt

      - name: Guardrail — CI workflows
        # Separate step so "someone re-added kubectl apply to a PR job" is its own
        # red X, not buried in a manifest report.
        if: always()
        run: |
          set +e
          python3 solution/scripts/validate_manifest.py \
            --workflows .github/workflows \
            --policy solution/policy/guardrail.yaml >> /tmp/guardrail.txt 2>&1
          echo "workflow_rc=$?" >> "$GITHUB_ENV"
          tail -n 40 /tmp/guardrail.txt

      - name: Plan (read-only diff against the live cluster)
        # Optional and explicitly read-only: a token bound to a role with `get`/`list`
        # on this namespace only. Skipped on forks, which never get the token.
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          KUBE_READONLY_TOKEN: ${{ secrets.KUBE_READONLY_TOKEN }}
        run: |
          kubectl diff -f /tmp/rendered.yaml > /tmp/plan.txt 2>&1 || true
          head -c 20000 /tmp/plan.txt

      - name: Publish change summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: change-summary
          path: |
            /tmp/change-summary.json
            /tmp/guardrail.txt
            /tmp/rendered.yaml

      - name: Comment on the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Guardrail report"
            echo
            echo '```'
            cat /tmp/guardrail.txt
            echo '```'
            echo
            echo "Machine-readable summary: see the \`change-summary\` artifact."
            echo "_A passing guardrail is a floor, not an approval. A human still owns this change._"
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md

      # The job's own exit status is the merge gate; make it a required status check
      # in branch protection so a red guardrail cannot be merged past.
      - name: Enforce
        if: always()
        run: |
          echo "manifest_rc=${manifest_rc:-2} workflow_rc=${workflow_rc:-2}"
          if [ "${manifest_rc:-2}" != "0" ] || [ "${workflow_rc:-2}" != "0" ]; then
            echo "::error::guardrail did not pass — see the PR comment. rc=2 means it could not evaluate (fail closed)."
            exit 1
          fi
