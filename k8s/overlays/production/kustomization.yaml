apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - ../../base
# Not includeSelectors: a Deployment's selector is immutable, so an overlay must
# never add to it — that is a "field is immutable" apply failure waiting to happen.
labels:
  - pairs:
      app.kubernetes.io/instance: production
# The image tag is set here rather than in the base so a release is a one-line
# overlay change with nothing else in the diff — which is the shape the guardrail
# and the reviewer both want.
images:
  - name: registry.example.com/inference-gateway
    newTag: "2.4.1"
