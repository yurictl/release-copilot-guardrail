# Evidence A — the currently-deployed Deployment.
#
# The namespace comes from the overlay (k8s/overlays/production), so this file is
# the shape of the workload and the overlay decides where it lands. The guardrail
# never reads this file directly in CI: it reads what `kustomize build` produces,
# because that is what would actually be applied.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gateway
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 2
      maxSurge: 0
  selector:
    matchLabels:
      app: inference-gateway
  template:
    metadata:
      labels:
        app: inference-gateway
    spec:
      containers:
        - name: gateway
          image: registry.example.com/inference-gateway:2.4.1
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - name: MODEL_PROVIDER
              value: "internal"
            - name: REDIS_URL
              value: "redis://cache.production.svc.cluster.local:6379"
            - name: OPENAI_API_KEY
              value: "sk-test-placeholder"
