# Evidence A — the currently-deployed Deployment.
#
# The namespace comes from the overlay (k8s/overlays/production), so this file is
# the shape of the workload and the overlay decides where it lands. The guardrail
# never reads this file directly in CI: it reads what `kustomize build` produces,
# because that is what would actually be applied.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gateway
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 2
  selector:
    matchLabels:
      app: inference-gateway
  template:
    metadata:
      labels:
        app: inference-gateway
    spec:
      containers:
        - name: gateway
          image: registry.example.com/inference-gateway:2.4.1
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 5
            failureThreshold: 18        # 90s budget for a documented 20-40s warm-up
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          env:
            - name: MODEL_PROVIDER
              value: "internal"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: inference-gateway-secrets
                  key: redis_url
