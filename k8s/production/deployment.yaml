# Evidence A — current production Deployment (the approved baseline).
# The guardrail treats this file as the `--baseline` for diff-aware checks.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gateway
  namespace: production
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: inference-gateway
  template:
    metadata:
      labels:
        app: inference-gateway
    spec:
      containers:
        - name: gateway
          image: registry.example.com/inference-gateway:2.4.1
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          env:
            - name: MODEL_PROVIDER
              value: "internal"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: inference-gateway-secrets
                  key: redis_url
